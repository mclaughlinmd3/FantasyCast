<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FantasyCast - TV</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="tv.css" />
</head>
<body>
  <div class="tv">
    <div class="tv-header">
      <span id="league-name">FantasyCast</span>
      <span id="week-label"></span>
    </div>
    <div class="matchup">
      <div class="team team-a">
        <img class="avatar" id="a-avatar" alt="" />
        <div class="team-name" id="a-name">--</div>
        <div class="team-record" id="a-record"></div>
        <div class="score" id="a-score">0.00</div>
      </div>
      <div class="vs">VS</div>
      <div class="team team-b">
        <img class="avatar" id="b-avatar" alt="" />
        <div class="team-name" id="b-name">--</div>
        <div class="team-record" id="b-record"></div>
        <div class="score" id="b-score">0.00</div>
      </div>
    </div>
    <div class="tv-footer">
      <span id="updated-at"></span>
      <span id="rotate-indicator"></span>
    </div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="tv.js"></script>
</body>
</html>
